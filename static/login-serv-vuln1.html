	<title>Login?</title>

<body>

<header>
	<a href="signup-page.html">Sign-Up</a>
</header>

<main>
	<form	action="/login" method="POST">
		<div id="centerFH">
			<h1>Login</h1>
		</div>
		<div id="login-style">
			<div class="aligner">
				<lable for="username">Username:</lable>
				<input type="text" name="username" autocomplete="name">
			</div>
			
			<div class="aligner">
				<lable for="pass">Password:</lable>
				<input type="text" name="pass" autocomplete="password">
			</div>
			
			<div class="aligner">
				<lable for="passconf">Password Confirmation:</lable>
				<input type="text" name="passconf" autocomplete="password">
			</div>	

			<div id="alignBottoms">
			<button type="submit">Submit Here</button>
			<a href="change-pass.html">forgot password</a>
			</div>
		</div>
		
	</form>
</main>

</body>
