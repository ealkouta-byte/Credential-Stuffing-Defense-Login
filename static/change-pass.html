<!DOCTYPE html>
<html lang="eng">

<head>
	<meta charset="UTF-8">
	<meta name="Samuel Hager" content="this is the start of something new!">
	<meta name="viewport" content="width=device-width">
	<link rel="stylesheet" href="static/change-pass.css">
	<title>Change?</title>
</head>

<body>

<header>
	<a href="signup-page.html">Sign-Up</a>
    <a href="login-serv-vuln1.html">Login</a>
</header>

<main>
	<form	action="/changepass" method="POST">
		<div id="centerFH">
			<h1>Change Password? Why?</h1>
		</div>
		<div id="change-pass">
			<div class="aligner">
				<label for="username_or_email">Username or Email:</label>
				<input type="text" name="username_or_email" id="username_or_email" autocomplete="username" required>
			</div>
			
			<div class="aligner">
				<label for="oldPassword">Old Password:</label>
				<input type="password" name="oldPassword" id="oldPassword" autocomplete="password" required>
			</div>
			
			<div class="aligner">
				<label for="newPassword">New Password</label>
				<input type="password" name="newPassword" id="newPassword" autocomplete="new-password" required>
			</div>	

			<button type="submit">Submit Here</button>
		</div>
		
	</form>
</main>

</body>

<footer></footer>

</html>
