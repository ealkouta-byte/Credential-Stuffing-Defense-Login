<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="Samuel Hager" content="this is the start of something new!">
	<meta name="viewport" content="width=device-width">
	<link rel="stylesheet" href="/static/signer.css">
	<title>Sign Up?</title>
</head>

<body>

<header>
	<a href="login-serv-vuln1.html">Login</a>
</header>

<main>
	<form action="/signup" method="POST">
		<div id="centerFH">
			<h1>Create Account</h1>
		</div>
		<div id="signup-style">
			<div class="aligner">
				<label for="email">Email:</label>
				<input type="email" name="email" id="email" autocomplete="email" required>
			</div>
			<div class="aligner">
				<label for="emailConfirmation">Email Confirmation:</label>
				<input type="email" name="emailConfirmation" id="emailConfirmation" autocomplete="email" required>
			</div>
			<div class="aligner">
				<label for="username">Username:</label>
				<input type="text" name="username" id="username" autocomplete="username" required>
			</div>
			
			<div class="aligner">
				<label for="password">Password:</label>
				<input type="password" name="password" id="password" autocomplete="password" required>
			</div>
			
			<div class="aligner">
				<label for="passwordConfirmation">Password Confirmation:</label>
				<input type="password" name="passwordConfirmation" id="passwordConfirmation" autocomplete="new-password" required>
			</div>
			<div id="alignBottoms">
			<button type="submit" id="button">Submit Here</button>
			<a href="change-pass.html">forgot password</a>
			</div>
		</div>
		
	</form>
</main>

</body>

<footer></footer>

</html>
